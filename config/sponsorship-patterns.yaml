supported:
  - "(?:visa|employment) sponsorship (?:is|will be) (?:available|provided|offered)"
  - "we sponsor (?:employment|work) visas"
  - "international students (?:are|may be) eligible"
  - "cpt(?:/opt)? (?:is|are) (?:accepted|supported|eligible)"
unsupported:
  - "no sponsorship (?:is )?(?:available|provided|offered)(?: now or in the future)?"
  - "(?:will|can) not (?:provide|offer) (?:employment |visa )?sponsorship"
  - "must not (?:now or in the future )?require sponsorship"
  - "u\\.?s\\.? citizens? only"
  - "(?:permanent resident|green card holder)s? only"
  - "unrestricted permanent (?:u\\.?s\\.? )?work authorization (?:is )?required"
  - "(?:active )?(?:secret|top secret|ts/sl|ts/sci) (?:security )?clearance (?:is )?required"
  - "must be eligible to obtain (?:a )?(?:secret|top secret|security) clearance"
  - "due to (?:u\\.?s\\.? )?export control.{0,120}(?:u\\.?s\\.? person|citizen|permanent resident)"
  # Employers phrase "no sponsorship" many ways, and most never use the word
  # sponsorship at all — requiring citizenship or permanent residency says the
  # same thing. Anchored to imperative wording so that boilerplate such as
  # "regardless of citizenship" in an EEO statement does not match.
  - "(?:are|is|we are|we're) (?:not|unable) (?:able |currently )?to sponsor"
  - "(?:do|does|will|can) not (?:currently )?sponsor"
  - "no (?:visa |employment |work )?sponsorship"
  - "sponsorship (?:is )?not (?:available|offered|provided)"
  - "without (?:the need for |any need for |requiring )?(?:visa |employment |work )?sponsorship"
  - "(?:must|need to) be (?:a |an )?(?:u\\.?s\\.?|united states) citizen"
  - "(?:u\\.?s\\.?|united states) citizenship (?:is )?(?:required|a requirement)"
  - "(?:must be|requires?)(?: a| an)? (?:u\\.?s\\.? )?(?:citizen|permanent resident|green card holder)"
  - "(?:u\\.?s\\.?|united states) citizens? or (?:lawful )?permanent residents?"
  - "citizens? or (?:lawful )?permanent residents? only"
  - "(?:must be|be) (?:a |an )?u\\.?s\\.? person"
  # Defense and aerospace employers state a status the role requires rather than
  # a policy on sponsorship, and they state it as a noun. "U.S. Person status is
  # required as this position needs to access export controlled data" matched
  # none of the rules above - the person rule wants "must be a U.S. person", the
  # export rule wants "due to export control" ahead of the person - so every
  # Anduril intern requisition classified UNKNOWN and one reached the digest.
  - "(?:u\\.?s\\.?|united states)[ -]person status"
  - "(?:u\\.?s\\.?|united states)[ -](?:citizens?(?:hip)?|green\\s?card holders?|permanent residents?)\\b[^.]{0,40}status (?:is|are) required"
  - "\\bitar\\b"
  - "must be legally authoriz(?:ed|able) to work.{0,80}without (?:current or future |any )?sponsorship"
  # Read off five live postings that stated a policy every rule above missed.
  # Each is anchored on declarative or imperative wording, which is what keeps
  # the application form out of it: a Greenhouse page ends in "Will you now or
  # in the future require sponsorship for employment visa status? * Select...",
  # and that is a question put to the candidate rather than anything the
  # employer has said about the role. Eight of forty postings sampled carry that
  # question and not one of them may be read as an answer.
  #
  # Baird: "Baird is not currently hiring individuals for this position who now
  # or in the future require sponsorship for employment visa status."
  - "(?:is|are) not (?:currently )?(?:hiring|considering|able to hire|in a position to hire)[^.]{0,90}requires? sponsorship"
  # FTI Consulting: "this position does not provide visa sponsorship".
  # Vanguard: "Vanguard is not offering visa sponsorship for this position."
  - "(?:does|do|will|is|are) not (?:currently )?(?:able to )?(?:provide|offer|offering|providing|support|supporting)(?: any)? (?:visa |employment |work |immigration )?sponsorship"
  # CNO Financial: "Candidates must currently possess unrestricted authorization
  # to work in the United States". An F-1 on OPT does not: the authorization is
  # tied to the school and the field of study.
  - "must (?:currently )?(?:possess|have|hold)[^.]{0,50}unrestricted[^.]{0,30}authorization to work"
  # Royal Caribbean: "Must have authorization to work in the U.S. on a permanent
  # and ongoing basis". Not [^.], because the abbreviation puts full stops in
  # the middle of the sentence.
  - "authoriz\\w+ to work.{0,70}permanent (?:and ongoing )?basis"
  - "not (?:be )?requir(?:e|ing) (?:visa |employment |work )?sponsorship (?:now or in the future)?"
ambiguous:
  - "authorized to work in the (?:united states|u\\.?s\\.?)"
  - "work authorization"
  - "sponsorship"
