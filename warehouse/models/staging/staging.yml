version: 2

models:
  - name: stg_source_observations
    description: "GRAIN: one landed observation record, including restatements."
    columns:
      - name: observation_id
        description: "Explicit key of the landed record."
        tests: [not_null, unique]
      - name: canonical_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
      - name: source_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['greenhouse','lever','ashby','smartrecruiters','linkedin','intern-list','community']
      - name: posting_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OPEN','CLOSED']
      - name: sponsorship_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUPPORTED','UNKNOWN','UNSUPPORTED']
      - name: material_fingerprint
        tests: [not_null]

  - name: stg_application_status_events
    description: "GRAIN: one recorded application-status transition."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: canonical_key
        tests: [not_null]
      - name: to_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DISCOVERED','MIRRORED','APPLIED_FLAGGED','REJECTED_FLAGGED','WITHDRAWN']
      - name: recorded_at
        tests: [not_null]
      - name: ingested_at
        tests: [not_null]
